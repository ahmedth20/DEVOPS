
    services:
      app:
        image: aymenkhelifa278/kaddem:latest
        container_name: kaddem_app1
        ports:
          - "8090:8089"
        environment:
          SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/kaddem_db?&createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD:
        depends_on:
          - mysql-db
        networks:
          - spring-boot-network
        restart: always

      mysql-db:
        image: mysql:8.0
        container_name: mysql-db
        environment:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: kaddem_db
        ports:
          - "3309:3306"
        volumes:
          - mysql-data:/var/lib/mysql
        networks:
          - spring-boot-network
        restart: always

